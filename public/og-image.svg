<svg viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0a"/>
  
  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Logo - scaled 4.375x from 32x32 to 140x140 -->
  <g transform="translate(100, 180) scale(4.375)">
    <!-- Background -->
    <rect width="32" height="32" rx="6" fill="#0a0a0a"/>
    <!-- Outer square -->
    <rect x="2" y="2" width="28" height="28" rx="4" stroke="#f5c842" stroke-width="2.5" fill="none"/>
    <!-- R letterform -->
    <path d="M10 24V8h8c2.5 0 4.5 2 4.5 4.5s-2 4-4.5 4h-5m0 7.5l5-7" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Yellow dot -->
    <circle cx="26" cy="26" r="2" fill="#f5c842"/>
  </g>
  
  <!-- Brand name -->
  <text x="100" y="400" font-family="'Syne', sans-serif" font-size="80" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">
    ronny.tech
  </text>
  
  <!-- Subtitle -->
  <text x="100" y="460" font-family="'Syne', sans-serif" font-size="32" font-weight="400" fill="rgba(255,255,255,0.4)" letter-spacing="0.05em">
    CREATIVE DEVELOPER
  </text>
  
  <!-- Yellow accent line -->
  <rect x="100" y="490" width="80" height="3" fill="#f5c842"/>
  
  <!-- Tech stack -->
  <g transform="translate(100, 540)" opacity="0.3">
    <text font-family="'DM Sans', sans-serif" font-size="14" fill="#ffffff" letter-spacing="0.1em">
      REACT • NEXT.JS • TYPESCRIPT • TAILWIND
    </text>
  </g>
</svg>